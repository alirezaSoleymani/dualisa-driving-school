<section class="hero">
  <div class="shape-mask" [style.background-image]="bgStyle"></div>

  <app-navbar></app-navbar>

  <div class="content">
    <h1 class="title">{{service.title}}</h1>
    <p class="description">{{service.description}}</p>
  </div>

  <button class="send-request-btn" (click)="modalService.open()">
    <span>{{servicesData.sendRequestBtn}}</span><span>>>></span>
  </button>
</section>

<section class="info">
  <h2>{{service.detailedContentTitle}}</h2>
  <p>{{service.detailedContent}}</p>
</section>

<section class="pricing-details">
  <div class="pricing-card">
    <div class="pricing-card__title">{{servicesData.pricingDetails}}</div>

    <div class="pricing-card__description">
      {{service.pricingDetailsDescription}}
    </div>

    <div class="price-box">
      <div class="price-box__label">{{servicesData.price}}</div>

      <div class="price-box__prices">
        @if (service.discountedPrice !== '') {
        <span class="discounted-price">{{service.discountedPrice}}</span>
        }

        <span class="default-price">{{service.defaultPrice}}</span>
      </div>
    </div>
  </div>
</section>

<img src="/images/shapes/net-background.svg" class="net-background" />

<div
  class="overlay"
  [class.visible]="modalService.isModalOpen()"
  (click)="modalService.close()"
></div>

<div class="contact-form-modal" [class.visible]="modalService.isModalOpen()">
  <!-- <button class="close-btn" (click)="modalService.close()">✕</button> -->
  <app-contact-form (close)="modalService.close()"></app-contact-form>
</div>
